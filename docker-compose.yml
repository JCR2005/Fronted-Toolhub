version: '3.8'
services:
  backend:
    build:
      context: ../ToolhubBackend
    image: pdf2docx-backend:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ToolhubFrontend.Dockerfile
    image: img2pdf-frontend:latest
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
